[project]
name = "wildfire-watch-sim"
version = "0.1.0"
description = "Kinematic drone-flight simulator for wildfire-watch."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
sapphire-bridge = [
  "requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
